# cargo-about: generates the Rust part of THIRD_PARTY_NOTICES.md.
#   cargo about generate --all-features --workspace about.hbs -o target/rust-notices.md
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Aural's own crates are not third-party.
private = { ignore = true }
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "CC0-1.0",
]
