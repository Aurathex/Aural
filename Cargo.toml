[workspace]
resolver = "2"
members = [
  "crates/aural-core",
  "crates/aural-audio",
  "crates/aural-engines",
  "crates/aural-models",
  "crates/aural-platform",
  "crates/aural-stt-protocol",
  "tools/bench",
  "workers/stt-onnx",
  "workers/stt-ggml",
  "app/src-tauri",
]
# Plain `cargo build` / `cargo test` / `cargo clippy` cover the libraries, bench and
# protocol. Left out, and built with `-p`: the two workers (their aural-engines
# features are mutually exclusive, so never use `--workspace`) and the Tauri app,
# which needs the frontend build and staged sidecars first (docs/building-windows.md).
default-members = [
  "crates/aural-core",
  "crates/aural-audio",
  "crates/aural-engines",
  "crates/aural-models",
  "crates/aural-platform",
  "crates/aural-stt-protocol",
  "tools/bench",
]

[workspace.package]
edition = "2021"
license = "PolyForm-Strict-1.0.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
