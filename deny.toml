[graph]
targets = ["x86_64-pc-windows-msvc"]
# Check optional engine dependencies too (onnx/ggml features). cargo-deny reads cargo
# metadata only, so the onnx/ggml compile_error! does not apply here.
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.9
# Aural's own crates (publish = false) carry Aural's license, which is not a
# dependency license; only third-party crates are checked against the list above.
private = { ignore = true }

# Mozilla CA root certificate data, pulled in at build time by ort-sys (via ureq) to
# download ONNX Runtime. Data-only, permissive; scoped to this crate only.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Mozilla CA root certificates compiled into the app for HTTPS model downloads (via
# ureq). Data-only, permissive; attribution in THIRD_PARTY_NOTICES.md.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# "Unmaintained" notices (no known vulnerability) for the unic-* Unicode tables that
# Tauri uses via tauri-utils -> urlpattern. Nothing to upgrade to until Tauri moves;
# re-check on every Tauri upgrade.
ignore = [
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range unmaintained; transitive via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common unmaintained; transitive via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property unmaintained; transitive via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version unmaintained; transitive via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident unmaintained; transitive via tauri-utils/urlpattern" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (no vulnerability); compile-time macro used by tokenizers (AI cleanup text models)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
