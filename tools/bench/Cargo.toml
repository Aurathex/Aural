[package]
name = "aural-bench"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Developer tool: benchmark local STT engines (WER, latency, memory). Not shipped."

[features]
# Engines are mutually exclusive: ONNX Runtime and whisper.cpp must not share a binary.
onnx = []
ggml = []
vulkan = ["ggml"]
cuda = ["ggml"]

[dependencies]
anyhow = "1.0.104"
hound = "3.5.1"
rubato = "5.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
