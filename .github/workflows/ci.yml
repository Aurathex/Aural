name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      # whisper-rs generates bindings with bindgen (LLVM is preinstalled on the runner).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-26
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Libraries, bench and protocol (default members; no Tauri, no engines).
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Parakeet (ONNX) bench adapter
        run: cargo test -p aural-bench --features onnx

      # Speech workers: built one at a time (their engine features are exclusive),
      # then staged next to the app together with DirectML and the MSVC runtime.
      - run: cargo clippy -p aural-engines --features onnx --all-targets -- -D warnings
      - run: cargo clippy -p aural-engines --features ggml --all-targets -- -D warnings
      - run: cargo clippy -p aural-stt-onnx --all-targets -- -D warnings
      - run: cargo clippy -p aural-stt-ggml --all-targets -- -D warnings  # CPU build; prepare-bundle below also compiles the Vulkan build
      - name: Vulkan SDK (GPU support for the Whisper worker)
        shell: pwsh
        env:
          VULKAN_SDK_URL: https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkansdk-windows-X64-1.4.357.0.exe
          VULKAN_SDK_SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
        run: |
          Invoke-WebRequest $env:VULKAN_SDK_URL -OutFile vulkansdk.exe
          $hash = (Get-FileHash vulkansdk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK hash mismatch: $hash" }
          $dir = 'C:\VulkanSDK\1.4.357.0'
          Start-Process ./vulkansdk.exe -Wait -ArgumentList '--root', $dir, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if (-not (Test-Path "$dir\Bin\glslc.exe")) { throw 'Vulkan SDK did not install' }
          "VULKAN_SDK=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Stage sidecars and runtime DLLs
        shell: pwsh
        run: ./scripts/prepare-bundle.ps1 -BuildProfile debug

      # Settings window and pill.
      - name: Frontend install
        working-directory: app
        run: npm ci
      - name: Frontend type check
        working-directory: app
        run: npm run check
      - name: Frontend tests
        working-directory: app
        run: npm test
      - name: Frontend build
        working-directory: app
        run: npm run build

      # The Tauri app itself.
      - run: cargo clippy -p aural --all-targets -- -D warnings
      - run: cargo test -p aural

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Reject tracked files over 5 MB
        shell: bash
        run: |
          git ls-files -z | xargs -0 du -k | awk '$1>5120{print; bad=1} END{exit bad}'
