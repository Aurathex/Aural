name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      # whisper-rs generates bindings with bindgen (LLVM is preinstalled on the runner).
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Libraries, bench and protocol (default members; no Tauri, no engines).
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Parakeet (ONNX) bench adapter
        run: cargo test -p aural-bench --features onnx

      # Speech workers: built one at a time (their engine features are exclusive),
      # then staged next to the app together with DirectML and the MSVC runtime.
      - run: cargo clippy -p aural-stt-onnx --all-targets -- -D warnings
      - run: cargo clippy -p aural-stt-ggml --all-targets -- -D warnings
      - name: Stage sidecars and runtime DLLs
        shell: pwsh
        run: ./scripts/prepare-bundle.ps1 -BuildProfile debug

      # Settings window and pill.
      - name: Frontend install
        working-directory: app
        run: npm ci
      - name: Frontend type check
        working-directory: app
        run: npm run check
      - name: Frontend tests
        working-directory: app
        run: npm test
      - name: Frontend build
        working-directory: app
        run: npm run build

      # The Tauri app itself.
      - run: cargo clippy -p aural --all-targets -- -D warnings
      - run: cargo test -p aural

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked files over 5 MB
        shell: bash
        run: |
          git ls-files -z | xargs -0 du -k | awk '$1>5120{print; bad=1} END{exit bad}'
