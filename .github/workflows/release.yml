name: Release

# Push a tag like v0.1.0 to build the Windows installer and the WinGet manifests and
# attach them to a *draft* GitHub Release. Nothing is published until a maintainer
# reviews the draft and publishes it by hand.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write      # create the draft release
  id-token: write      # build provenance attestation
  attestations: write

env:
  # Must match LICENSE.md; used for the WinGet manifest.
  LICENSE_ID: PolyForm-Strict-1.0.0

jobs:
  windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-26
        with:
          toolchain: "1.98.1"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != app version $version" }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Check lock files are current
        shell: pwsh
        run: |
          # Fails if Cargo.lock would need changes; npm ci below fails likewise for package-lock.json.
          cargo metadata --locked --format-version 1 > $null
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock is out of date' }

      - name: Vulkan SDK (GPU support for the Whisper worker)
        shell: pwsh
        env:
          VULKAN_SDK_URL: https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkansdk-windows-X64-1.4.357.0.exe
          VULKAN_SDK_SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
        run: |
          Invoke-WebRequest $env:VULKAN_SDK_URL -OutFile vulkansdk.exe
          $hash = (Get-FileHash vulkansdk.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:VULKAN_SDK_SHA256) { throw "Vulkan SDK hash mismatch: $hash" }
          $dir = 'C:\VulkanSDK\1.4.357.0'
          Start-Process ./vulkansdk.exe -Wait -ArgumentList '--root', $dir, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if (-not (Test-Path "$dir\Bin\glslc.exe")) { throw 'Vulkan SDK did not install' }
          "VULKAN_SDK=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build speech workers and stage runtime
        shell: pwsh
        run: ./scripts/prepare-bundle.ps1 -BuildProfile release

      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build

      - name: WinGet manifests, build info and checksums
        shell: pwsh
        run: |
          $installer = "target/release/bundle/nsis/Aural_${env:VERSION}_x64-setup.exe"
          Copy-Item $installer .
          $dir = ./packaging/winget/New-WingetManifests.ps1 -Version $env:VERSION -Installer $installer `
            -Repository "${{ github.repository }}" -License $env:LICENSE_ID -OutDir winget-out
          Compress-Archive -Path "winget-out/manifests" -DestinationPath "winget-manifests-${env:VERSION}.zip"
          # What was built, from what, with what: enough to rebuild and compare.
          function Sha([string]$p) { (Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant() }
          @(
            "Aural $env:VERSION",
            "repository: ${{ github.repository }}",
            "commit: ${{ github.sha }}",
            "tag: ${{ github.ref_name }}",
            "workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "runner image: $env:ImageOS $env:ImageVersion",
            "rustc: $(rustc --version)",
            "cargo: $(cargo --version)",
            "node: $(node --version)",
            "npm: $(npm --version)",
            "tauri-cli: $(npx --prefix app tauri --version)",
            "cmake: $((cmake --version)[0])",
            "Cargo.lock sha256: $(Sha Cargo.lock)",
            "app/package-lock.json sha256: $(Sha app/package-lock.json)",
            "manifests/catalog.v2.json sha256: $(Sha manifests/catalog.v2.json)"
          ) | Out-File -Encoding ascii BUILD-INFO.txt
          # Bundled Microsoft DLLs come from the build machine, so record exactly which.
          Get-ChildItem app/src-tauri/runtime -Filter *.dll | ForEach-Object {
            "$($_.Name): $($_.VersionInfo.FileVersion) sha256 $(Sha $_.FullName)"
          } | Out-File -Encoding ascii -Append BUILD-INFO.txt
          $files = @("Aural_${env:VERSION}_x64-setup.exe", "winget-manifests-${env:VERSION}.zip", 'BUILD-INFO.txt')
          $files | ForEach-Object { "$(Sha $_)  $_" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content BUILD-INFO.txt, SHA256SUMS.txt

      # Lets anyone check with `gh attestation verify <file> --repo Aurathex/Aural` that a
      # download was built by this workflow from this commit.
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            Aural_${{ env.VERSION }}_x64-setup.exe
            winget-manifests-${{ env.VERSION }}.zip

      - name: Draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: Aural ${{ env.VERSION }}
          files: |
            Aural_${{ env.VERSION }}_x64-setup.exe
            SHA256SUMS.txt
            BUILD-INFO.txt
            winget-manifests-${{ env.VERSION }}.zip
