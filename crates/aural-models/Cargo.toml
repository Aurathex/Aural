publish = false
description = "Aural model catalog, install store, verified downloads and recommendations."

[dependencies]
anyhow = "1.0.104"
aural-engines = { path = "../aural-engines" }
aural-platform = { path = "../aural-platform" }
aural-stt-protocol = { path = "../aural-stt-protocol" }
serde = { version = "1", features = ["derive"] }
