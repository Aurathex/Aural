[package]
name = "aural-engines"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Local speech-to-text engine adapters for Aural (Parakeet via ONNX, Whisper via ggml)."

[features]
# Engines are mutually exclusive: ONNX Runtime and whisper.cpp must not share a binary.
onnx = ["dep:transcribe-rs", "transcribe-rs/onnx", "transcribe-rs/ort-directml", "dep:log", "dep:aural-platform", "dep:serde_json", "dep:ort", "dep:ndarray", "dep:tokenizers"]
ggml = ["dep:whisper-rs", "whisper-rs/log_backend", "whisper-rs/raw-api", "dep:log"]
vulkan = ["ggml", "whisper-rs/vulkan"]
cuda = ["ggml", "whisper-rs/cuda"]
clap = ["dep:clap"]

[dependencies]
anyhow = "1.0.104"
aural-platform = { path = "../aural-platform", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
log = { version = "0.4", features = ["std"], optional = true }
# Same versions transcribe-rs uses, so the text models share its ONNX Runtime.
ndarray = { version = "0.17", optional = true }
ort = { version = "=2.0.0-rc.12", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
transcribe-rs = { version = "0.3.11", default-features = false, optional = true }
whisper-rs = { version = "0.16.0", optional = true }

[dev-dependencies]
aural-audio = { path = "../aural-audio" }
serde_json = "1.0.151"
tempfile = "3.27.0"

[lints]
workspace = true
