<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Aural">
  <!-- A voice wave that loses amplitude as it moves forward, straightens, and resolves
       into a point: speech flowing into text. -->
  <path d="M6 32 C 10 13, 17 13, 20 32 S 29 45, 32 32 S 38 26, 40 32 L 48 32"
        stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="55.5" cy="32" r="4" fill="currentColor"/>
</svg>
