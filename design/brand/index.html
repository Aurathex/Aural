<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aural brand</title>
<style>
  body { margin: 0; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .row { display: flex; gap: 28px; align-items: center; padding: 28px; }
  .light { background: #fff; color: #0b0b0b; }
  .dark { background: #0b0b0b; color: #fff; }
  .mark { color: inherit; }
  .word { display: flex; align-items: center; gap: 10px; font: 600 28px "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -0.02em; }
  .pill { display: flex; align-items: center; gap: 10px; width: 176px; height: 36px; box-sizing: border-box; padding: 0 14px; border-radius: 18px; background: #0b0b0b; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 6px 24px rgba(0,0,0,.28); color: #fff; }
  .bars { display: flex; gap: 3px; align-items: center; height: 20px; }
  .bars i { display: block; width: 2px; border-radius: 1px; background: #fff; }
</style>
</head>
<body>
  <div class="row light">
    <img src="aural-icon.svg" width="256" height="256" alt="Aural app icon">
    <img src="aural-icon.svg" width="64" height="64" alt="">
    <img src="aural-icon.svg" width="32" height="32" alt="">
    <img src="aural-icon.svg" width="16" height="16" alt="">
    <div class="word"><svg class="mark" width="40" height="40" viewBox="0 0 64 64" fill="none"><path d="M6 32 C 10 13, 17 13, 20 32 S 29 45, 32 32 S 38 26, 40 32 L 48 32" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="55.5" cy="32" r="4" fill="currentColor"/></svg>Aural</div>
  </div>
  <div class="row dark">
    <img src="aural-icon.svg" width="64" height="64" alt="">
    <img src="aural-icon.svg" width="32" height="32" alt="">
    <img src="aural-icon.svg" width="16" height="16" alt="">
    <div class="word"><svg class="mark" width="40" height="40" viewBox="0 0 64 64" fill="none"><path d="M6 32 C 10 13, 17 13, 20 32 S 29 45, 32 32 S 38 26, 40 32 L 48 32" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="55.5" cy="32" r="4" fill="currentColor"/></svg>Aural</div>
  </div>
  <div class="row light">
    <div class="pill"><svg width="20" height="20" viewBox="0 0 64 64" fill="none"><path d="M6 32 C 10 13, 17 13, 20 32 S 29 45, 32 32 S 38 26, 40 32 L 48 32" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="55.5" cy="32" r="4.6" fill="#fff"/></svg>
      <div class="bars"><i style="height:4px"></i><i style="height:8px"></i><i style="height:14px"></i><i style="height:18px"></i><i style="height:12px"></i><i style="height:16px"></i><i style="height:20px"></i><i style="height:13px"></i><i style="height:9px"></i><i style="height:12px"></i><i style="height:6px"></i><i style="height:3px"></i></div>
    </div>
  </div>
</body>
</html>
